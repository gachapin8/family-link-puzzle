<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="format-detection" content="telephone=no"><meta name="theme-color" content="#17234f"><title>7 FRIENDS BOMB PARTY</title><style>
:root{--safeT:max(8px,env(safe-area-inset-top));--safeB:max(8px,env(safe-area-inset-bottom));--brown:#67412f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101736;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Arial Rounded MT Bold",sans-serif;touch-action:none}body{display:flex;justify-content:center}button{font:inherit}
#app{position:relative;width:min(100vw,470px);height:100dvh;min-height:100vh;overflow:hidden;background:radial-gradient(circle at 20% 8%,#3553a866,transparent 24%),radial-gradient(circle at 84% 12%,#ff6eb344,transparent 22%),linear-gradient(#19275b,#101737 76%,#080d25);color:#fff}

const canvas=document.getElementById("game"),ctx=canvas.getContext("2d"),imgs=AVATARS.map(s=>{const i=new Image();i.src=s;return i});
let W=0,H=0,dpr=1,tile=0,ox=0,oy=0,map=[],bombs=[],flames=[],items=[],actors=[],playerType=0,running=false,paused=false,over=false,timeLeft=90,score=0,last=0,aiTick=0;
let hold={up:false,down:false,left:false,right:false},nextMove=0;
function rnd(n){return Math.floor(Math.random()*n)}function inside(r,c){return r>=0&&r<ROWS&&c>=0&&c<COLS}function cc(r,c){return{x:ox+c*tile+tile/2,y:oy+r*tile+tile/2}}
function msg(t){const e=document.getElementById("msg");e.textContent=t;e.classList.add("show");clearTimeout(msg.t);msg.t=setTimeout(()=>e.classList.remove("show"),620)}
function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.floor(r.width*dpr);canvas.height=Math.floor(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);W=r.width;H=r.height;tile=Math.min(W/COLS,H/ROWS);ox=(W-tile*COLS)/2;oy=(H-tile*ROWS)/2}
addEventListener("resize",resize,{passive:true});addEventListener("orientationchange",()=>setTimeout(resize,160),{passive:true});
function buildMap(){map=Array.from({length:ROWS},()=>Array(COLS).fill(0));for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){if(r===0||c===0||r===ROWS-1||c===COLS-1)map[r][c]=1;else if(r%2===0&&c%2===0)map[r][c]=1;else if(Math.random()<.44)map[r][c]=2}const sp=[[1,1],[1,COLS-2],[ROWS-2,1],[ROWS-2,COLS-2],[1,5],[ROWS-2,5],[6,1]];for(const [r,c] of sp)for(const [dr,dc] of [[0,0],[1,0],[-1,0],[0,1],[0,-1]]){const rr=r+dr,cc=c+dc;if(inside(rr,cc)&&map[rr][cc]!==1)map[rr][cc]=0}}
function actor(type,r,c,human){return{type,r,c,human,alive:true,range:2,maxBombs:1,bombs:0,speed:human?95:210,shield:0,aiDir:[0,0],aiNext:0,inv:0}}
function reset(){buildMap();bombs=[];flames=[];items=[];actors=[];timeLeft=90;score=0;over=false;const sp=[[1,1],[1,COLS-2],[ROWS-2,1],[ROWS-2,COLS-2],[1,5],[ROWS-2,5],[6,1]],types=[playerType,...[0,1,2,3,4,5,6].filter(x=>x!==playerType)];sp.forEach((s,i)=>actors.push(actor(types[i],s[0],s[1],i===0)));last=performance.now();updateHud()}
function solid(r,c){if(!inside(r,c)||map[r][c]===1||map[r][c]===2)return true;return bombs.some(b=>b.r===r&&b.c===c)}
function move(a,dr,dc){if(!a.alive)return;const nr=a.r+dr,nc=a.c+dc;if(!solid(nr,nc)){a.r=nr;a.c=nc;collect(a)}}
function place(a){if(!a.alive||a.bombs>=a.maxBombs||bombs.some(b=>b.r===a.r&&b.c===a.c))return;bombs.push({r:a.r,c:a.c,owner:a,t:1.9,range:a.range});a.bombs++}
function flame(r,c){flames.push({r,c,t:.48})}
function explode(b){const i=bombs.indexOf(b);if(i<0)return;bombs.splice(i,1);b.owner.bombs=Math.max(0,b.owner.bombs-1);flame(b.r,b.c);for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]])for(let k=1;k<=b.range;k++){const r=b.r+dr*k,c=b.c+dc*k;if(!inside(r,c)||map[r][c]===1)break;flame(r,c);const ob=bombs.find(x=>x.r===r&&x.c===c);if(ob){ob.t=.01;break}if(map[r][c]===2){map[r][c]=0;if(Math.random()<.34)items.push({r,c,type:["fire","bomb","speed","shield"][rnd(4)]});break}}}
function collect(a){const i=items.findIndex(x=>x.r===a.r&&x.c===a.c);if(i<0)return;const it=items.splice(i,1)[0];if(it.type==="fire"){a.range=Math.min(6,a.range+1);if(a.human)msg("FIRE UP!")}if(it.type==="bomb"){a.maxBombs=Math.min(5,a.maxBombs+1);if(a.human)msg("BOMB UP!")}if(it.type==="speed"){a.speed=Math.max(45,a.speed-12);if(a.human)msg("SPEED UP!")}if(it.type==="shield"){a.shield=Math.min(2,a.shield+1);if(a.human)msg("SHIELD!")}if(a.human)score+=250}
function hit(a){if(!a.alive||a.inv>0)return;if(a.shield){a.shield--;a.inv=1.1;if(a.human)msg("SHIELD!");return}a.alive=false;if(a.human)finish(false);else{score+=1000;msg("RIVAL DOWN!")}}
function danger(r,c){if(flames.some(f=>f.r===r&&f.c===c))return true;for(const b of bombs){if(b.t>.7)continue;if(b.r===r&&Math.abs(b.c-c)<=b.range)return true;if(b.c===c&&Math.abs(b.r-r)<=b.range)return true}return false}
function ai(a,dt){if(!a.alive)return;a.aiNext-=dt;if(a.aiNext<=0){a.aiNext=.22+Math.random()*.28;const opts=[[1,0],[-1,0],[0,1],[0,-1],[0,0]].filter(([dr,dc])=>!solid(a.r+dr,a.c+dc)),safe=opts.filter(([dr,dc])=>!danger(a.r+dr,a.c+dc)),pick=(safe.length?safe:opts)[rnd((safe.length?safe:opts).length)]||[0,0];a.aiDir=pick;const nearCrate=[[1,0],[-1,0],[0,1],[0,-1]].some(([dr,dc])=>inside(a.r+dr,a.c+dc)&&map[a.r+dr][a.c+dc]===2),p=actors[0],nearP=p.alive&&Math.abs(p.r-a.r)+Math.abs(p.c-a.c)<=2;if((nearCrate||nearP)&&Math.random()<.3)place(a)}if(Math.random()<dt*4)move(a,a.aiDir[0],a.aiDir[1])}
function update(dt,ts){if(!running||paused||over)return;timeLeft-=dt;if(timeLeft<=0){timeLeft=0;finish(false);return}const p=actors[0];if(ts>=nextMove){let dr=0,dc=0;if(hold.up)dr=-1;else if(hold.down)dr=1;else if(hold.left)dc=-1;else if(hold.right)dc=1;if(dr||dc){move(p,dr,dc);nextMove=ts+p.speed}}for(let i=1;i<actors.length;i++)ai(actors[i],dt);for(const b of [...bombs]){b.t-=dt;if(b.t<=0)explode(b)}for(const f of flames)f.t-=dt;flames=flames.filter(f=>f.t>0);for(const a of actors){if(!a.alive)continue;a.inv=Math.max(0,a.inv-dt);if(flames.some(f=>f.r===a.r&&f.c===a.c))hit(a)}if(actors.slice(1).filter(a=>a.alive).length===0)finish(true);updateHud()}
function finish(win){if(over)return;over=true;running=false;if(win)score+=Math.ceil(timeLeft)*50;document.getElementById("resultTitle").textContent=win?"YOU WIN!":"GAME OVER";document.getElementById("resultScore").textContent=score.toLocaleString("ja-JP");document.getElementById("resultText").textContent=win?"6人全員を倒した！":"もう一度挑戦しよう。";document.getElementById("result").classList.add("show")}
function updateHud(){document.getElementById("time").textContent=Math.ceil(timeLeft);document.getElementById("rivals").textContent=actors.slice(1).filter(a=>a.alive).length;const p=actors[0];if(p)document.getElementById("power").textContent="🔥"+p.range+" 💣"+p.maxBombs+(p.shield?" 💗":"")}
function avatar(a){const p=cc(a.r,a.c),r=tile*.34,im=imgs[a.type];ctx.save();ctx.translate(p.x,p.y);if(a.inv>0&&Math.floor(a.inv*10)%2===0)ctx.globalAlpha=.35;ctx.save();ctx.beginPath();ctx.ellipse(0,0,r*.98,r*.91,0,0,Math.PI*2);ctx.clip();if(im.complete){const s=Math.min((r*2)/im.naturalWidth,(r*1.84)/im.naturalHeight),dw=im.naturalWidth*s,dh=im.naturalHeight*s;ctx.drawImage(im,-dw/2,-dh/2,dw,dh)}ctx.restore();ctx.strokeStyle=a.human?"#fff13d":"#ffffffaa";ctx.lineWidth=a.human?3:1.4;ctx.beginPath();ctx.ellipse(0,0,r*.98,r*.91,0,0,Math.PI*2);ctx.stroke();if(a.shield){ctx.strokeStyle="#66e5ff";ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,r*1.16,0,Math.PI*2);ctx.stroke()}ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle="#15315c";ctx.fillRect(0,0,W,H);for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const x=ox+c*tile,y=oy+r*tile;if(map[r][c]===0){ctx.fillStyle=(r+c)%2?"#254c75":"#2b557e";ctx.fillRect(x,y,tile,tile)}else if(map[r][c]===1){ctx.fillStyle="#8ca8bd";ctx.fillRect(x+1,y+1,tile-2,tile-2);ctx.fillStyle="#c1d1dc";ctx.fillRect(x+4,y+4,tile-8,tile*.2)}else{ctx.fillStyle="#ba793b";ctx.beginPath();ctx.roundRect(x+2,y+2,tile-4,tile-4,5);ctx.fill();ctx.strokeStyle="#e8b66e";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+4,y+4);ctx.lineTo(x+tile-4,y+tile-4);ctx.moveTo(x+tile-4,y+4);ctx.lineTo(x+4,y+tile-4);ctx.stroke()}}for(const it of items){const p=cc(it.r,it.c);ctx.font=(tile*.6)+"px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(it.type==="fire"?"🔥":it.type==="bomb"?"💣":it.type==="speed"?"👟":"💗",p.x,p.y)}for(const b of bombs){const p=cc(b.r,b.c);ctx.fillStyle="#111";ctx.beginPath();ctx.arc(p.x,p.y,tile*.31,0,Math.PI*2);ctx.fill();ctx.fillStyle="#ffb11e";ctx.beginPath();ctx.arc(p.x+tile*.18,p.y-tile*.23,tile*.075,0,Math.PI*2);ctx.fill()}for(const f of flames){const p=cc(f.r,f.c),q=.86+.14*Math.sin(performance.now()/55);ctx.fillStyle="#ffda45";ctx.beginPath();ctx.arc(p.x,p.y,tile*.39*q,0,Math.PI*2);ctx.fill();ctx.fillStyle="#ff5f34";ctx.beginPath();ctx.arc(p.x,p.y,tile*.22*q,0,Math.PI*2);ctx.fill()}for(const a of actors)if(a.alive)avatar(a)}
function loop(ts){if(!last)last=ts;const dt=Math.min(.035,(ts-last)/1000);last=ts;update(dt,ts);draw();requestAnimationFrame(loop)}
function bind(id,k){const e=document.getElementById(id),on=x=>{x.preventDefault();hold[k]=true},off=x=>{x.preventDefault();hold[k]=false};e.addEventListener("pointerdown",on);e.addEventListener("pointerup",off);e.addEventListener("pointercancel",off);e.addEventListener("pointerleave",off)}bind("up","up");bind("down","down");bind("left","left");bind("right","right");document.getElementById("bomb").addEventListener("pointerdown",e=>{e.preventDefault();if(running&&!paused)place(actors[0])});
function picker(){const g=document.getElementById("chars");for(let i=0;i<7;i++){const b=document.createElement("button");b.className="char";const im=document.createElement("img");im.src=AVATARS[i];const s=document.createElement("span");s.textContent="#"+(i+1);b.append(im,s);b.addEventListener("click",()=>{playerType=i;document.getElementById("pname").textContent="#"+(i+1);reset();running=true;paused=false;document.getElementById("picker").classList.remove("show")});g.appendChild(b)}}
document.getElementById("startBtn").addEventListener("click",()=>{document.getElementById("start").classList.remove("show");document.getElementById("picker").classList.add("show")});document.getElementById("again").addEventListener("click",()=>{document.getElementById("result").classList.remove("show");document.getElementById("picker").classList.add("show")});document.getElementById("resume").addEventListener("click",()=>{paused=false;last=performance.now();document.getElementById("pause").classList.remove("show")});document.getElementById("restart").addEventListener("click",()=>{document.getElementById("pause").classList.remove("show");reset();running=true;paused=false;last=performance.now()});document.addEventListener("visibilitychange",()=>{if(document.hidden&&running)paused=true;else if(running){paused=false;last=performance.now()}});
picker();resize();buildMap();requestAnimationFrame(loop);
</script></body></html>
